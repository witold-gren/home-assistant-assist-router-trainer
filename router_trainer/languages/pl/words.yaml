LESSONS: [matematyka, polski, angielski, historia, biologia, geografia, chemia, fizyka, WF, informatyka,
  plastyka, muzyka, religia, technika]

CHORES: [zmywarka, odkurzanie, śmieci, pranie, kuchnia, łazienka, pies]

UNKNOWN_QUESTIONS:
- Kiedy jest przegląd roweru?
- Ile kosztował ostatni rachunek za prąd?
- O której przyjedzie kurier?
- Kiedy wraca wujek z delegacji?
- Jaki jest kod do furtki?
- Ile stron przeczytałem wczoraj?

LESSON_TIMES:
- !tuple ['8:00', '8:45']
- !tuple ['8:55', '9:40']
- !tuple ['9:50', '10:35']
- !tuple ['10:55', '11:40']
- !tuple ['11:50', '12:35']
- !tuple ['12:45', '13:30']
- !tuple ['13:40', '14:25']

# facts of a test answer as patterns (testset/facts.py): the first letters of a word stand for
# all its forms („basen”, „basenie”), and inflection swaps some letters („pokój” / „pokoju”)
STEM_LETTERS: 5

INFLECTION_SWAPS:
  ó: '[óo]'
  o: '[oó]'
  ą: '[ąę]'
  ę: '[ęą]'

# Home Assistant state words that are ordinary words of the language - not a raw state in an
# answer (generate/answers.py): „on” is „he”
NOT_RAW_STATES: !tuple ['on', 'off']

# stems of words too general to test an answer (patterns of facts.pattern)
FACT_GENERIC: !tuple [roku, rok, tys, około, okolo, jest, był, była, było, oraz, który, która, stycz,
  luteg, marca, kwiet, maja, czerw, lipca, sierp, wrześ, paźdz, listo, grudn, dzien, dzień, godzi, minut,
  min]
